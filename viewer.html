<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Atendimento</title>
<style>
  body { font-family: Arial, sans-serif; padding: 16px; background: #f7f7f7; color: #222; }
  h2 { margin-bottom: 4px; }
  .atualizado { color: #666; font-size: 13px; margin-bottom: 20px; }
  table { border-collapse: collapse; width: 100%; max-width: 700px; }
  th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: middle; }
  th { background: #eee; }
  .valor { text-align: center; font-weight: bold; }
  .imagem-item img { max-width: 90px; max-height: 90px; border-radius: 6px; }
  .erro { color: #b00020; font-weight: bold; }
  .vazio { color: #888; font-style: italic; }
</style>
</head>
<body>

<h2>Atendimento</h2>
<div id="conteudo">Carregando...</div>

<script>
async function carregar() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const el = document.getElementById('conteudo');

  if (!id) {
    el.innerHTML = '<p class="erro">Nenhum ID informado no link.</p>';
    return;
  }

  try {
    const resp = await fetch('https://api.jsonbin.io/v3/b/' + id + '/latest');
    if (!resp.ok) {
      el.innerHTML = '<p class="erro">Não foi possível carregar o atendimento (status ' + resp.status + ').</p>';
      return;
    }
    const data = await resp.json();
    const itens = (data.record && data.record.items) || [];

    if (itens.length === 0) {
      el.innerHTML = '<p class="vazio">Nenhum ajuste registrado ainda.</p>';
      return;
    }

    let html = '';
    itens.forEach(item => {
      if (item.itens && item.itens.length > 0) {
        // Bloco agrupado por tópico: texto único + todas as imagens dos itens marcados
        html += '<div style="background:#fff;border:1px solid #ccc;border-radius:8px;padding:14px;margin-bottom:16px;max-width:700px;">';
        html += '<h3 style="margin:0 0 8px 0;">Tópico ' + (item.topico || '') + ' — ' + (item.nome_topico || '') + '</h3>';
        if (item.texto) {
          html += '<p style="white-space:pre-wrap;line-height:1.5;color:#333;">' + item.texto + '</p>';
        } else {
          html += '<p class="vazio">Texto do decreto ainda não cadastrado.</p>';
        }
        html += '<div style="margin-top:10px;">';
        item.itens.forEach(sub => {
          (sub.imagens || []).forEach(img => {
            html += '<div style="display:inline-block;text-align:center;margin:4px;">' +
                    '<img src="' + img.url + '" alt="' + (img.rotulo || '') + '">' +
                    '<div style="font-size:11px;color:#555;">' + (sub.codigo || '') + ' ' + (img.rotulo || '') + '</div>' +
                    '</div>';
          });
        });
        html += '</div></div>';
      } else {
        // Item normal com percentual
        html += '<table style="max-width:700px;margin-bottom:6px;"><tr>' +
                '<td style="border:1px solid #ccc;padding:8px 10px;width:80px;">' + (item.codigo || '') + '</td>' +
                '<td style="border:1px solid #ccc;padding:8px 10px;">' + (item.nome || '') + '</td>' +
                '<td class="valor" style="border:1px solid #ccc;padding:8px 10px;width:80px;">' + (item.valor || '') + '%</td>' +
                '</tr></table>';
      }
    });

    el.innerHTML = '<div class="atualizado">ID: ' + id + '</div>' + html;
  } catch (e) {
    el.innerHTML = '<p class="erro">Erro ao carregar: ' + e.message + '</p>';
  }
}
carregar();
</script>

</body>
</html>
